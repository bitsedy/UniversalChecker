<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Gateway Loader Preview | AggreGate Ghana</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0a0f1d;
      --text-muted: #64748b;
      --brand-emerald: #0f766e;
      --brand-mint: #10b981;
      --brand-gold: #f59e0b;
      --border-subtle: #e2e8f0;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 3rem 1.5rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-container {
      max-width: 780px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(10, 15, 29, 0.04);
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1.25rem;
      margin-bottom: 0.25rem;
    }
    .card-caption {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    /* Smart Gateway Loader Styles */
    .smart-gateway-loader {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .smart-gateway-loader .loader-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .smart-gateway-loader .loader-orbital-arc {
      transform-origin: 24px 24px;
      animation: gatewayOrbitalSpin 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .smart-gateway-loader .gateway-check {
      transform-origin: 24px 24px;
      animation: gatewayCorePulse 2s ease-in-out infinite;
    }
    @keyframes gatewayOrbitalSpin {
      0% {
        transform: rotate(0deg);
        stroke-dashoffset: 0;
      }
      50% {
        transform: rotate(180deg);
        stroke-dashoffset: -20;
      }
      100% {
        transform: rotate(360deg);
        stroke-dashoffset: -40;
      }
    }
    @keyframes gatewayCorePulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* Button Mockup */
    .mock-btn {
      background: var(--brand-emerald);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }
    .mock-btn .gateway-arch {
      stroke: #ffffff !important;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>Smart Gateway Loading Icon</h1>
    <p>Synced with payment processing, SMS dispatching, and transient grade evaluation.</p>

    <div class="grid">
      <!-- 80px Modal Hero State -->
      <div class="card">
        <div class="smart-gateway-loader" style="width: 80px; height: 80px;">
          <svg class="loader-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="loader-track" cx="50" cy="50" r="46" stroke="rgba(44, 116, 105, 0.18)" stroke-width="3"/>
            <circle class="loader-orbital-arc" cx="50" cy="50" r="46" stroke="#247867" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 220"/>
            <g transform="translate(18, 18) scale(0.64)">
              <rect width="100" height="100" rx="22" fill="#2C7469"/>
              <polygon points="43,21 49,21 26,79 17,79" fill="#0D1D2C"/>
              <polygon points="43,21 49,21 58,47 52,47" fill="#0D1D2C"/>
              <polygon points="56,61 61,61 68,79 59,79" fill="#0D1D2C"/>
              <path d="M30 53 L44 67 C45 68 47 68 48 67 L81 27 C82 25.5 81 24 79 24.5 L46 61 L32 49 C30.5 47.5 29 49 29.5 51 Z" fill="#0D1D2C"/>
              <path d="M74 14 C74 17.5 76 19.5 79.5 19.5 C76 19.5 74 21.5 74 25 C74 21.5 72 19.5 68.5 19.5 C72 19.5 74 17.5 74 14 Z" fill="#FFFFFF"/>
              <circle cx="74" cy="19.5" r="1.4" fill="#E6FFFA"/>
            </g>
          </svg>
        </div>
        <div class="card-title">Modal / Processing State</div>
        <div class="card-caption">80px — Checkout &amp; SMS Dispatch</div>
      </div>

      <!-- 48px Card State -->
      <div class="card">
        <div class="smart-gateway-loader" style="width: 48px; height: 48px;">
          <svg class="loader-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="loader-track" cx="50" cy="50" r="46" stroke="rgba(44, 116, 105, 0.18)" stroke-width="3"/>
            <circle class="loader-orbital-arc" cx="50" cy="50" r="46" stroke="#247867" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 220"/>
            <g transform="translate(18, 18) scale(0.64)">
              <rect width="100" height="100" rx="22" fill="#2C7469"/>
              <polygon points="43,21 49,21 26,79 17,79" fill="#0D1D2C"/>
              <polygon points="43,21 49,21 58,47 52,47" fill="#0D1D2C"/>
              <polygon points="56,61 61,61 68,79 59,79" fill="#0D1D2C"/>
              <path d="M30 53 L44 67 C45 68 47 68 48 67 L81 27 C82 25.5 81 24 79 24.5 L46 61 L32 49 C30.5 47.5 29 49 29.5 51 Z" fill="#0D1D2C"/>
              <path d="M74 14 C74 17.5 76 19.5 79.5 19.5 C76 19.5 74 21.5 74 25 C74 21.5 72 19.5 68.5 19.5 C72 19.5 74 17.5 74 14 Z" fill="#FFFFFF"/>
              <circle cx="74" cy="19.5" r="1.4" fill="#E6FFFA"/>
            </g>
          </svg>
        </div>
        <div class="card-title">Standard Section State</div>
        <div class="card-caption">48px — Lookup &amp; Advisor Engine</div>
      </div>

      <!-- 22px Button State -->
      <div class="card">
        <button class="mock-btn" style="margin-top: 10px; margin-bottom: 10px;">
          <div class="smart-gateway-loader" style="width: 22px; height: 22px;">
            <svg class="loader-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle class="loader-track" cx="50" cy="50" r="46" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"/>
              <circle class="loader-orbital-arc" cx="50" cy="50" r="46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="70 220"/>
              <g transform="translate(20, 20) scale(0.6)">
                <rect width="100" height="100" rx="22" fill="#2C7469"/>
                <polygon points="43,21 49,21 26,79 17,79" fill="#0D1D2C"/>
                <polygon points="43,21 49,21 58,47 52,47" fill="#0D1D2C"/>
                <polygon points="56,61 61,61 68,79 59,79" fill="#0D1D2C"/>
                <path d="M30 53 L44 67 C45 68 47 68 48 67 L81 27 C82 25.5 81 24 79 24.5 L46 61 L32 49 C30.5 47.5 29 49 29.5 51 Z" fill="#0D1D2C"/>
                <path d="M74 14 C74 17.5 76 19.5 79.5 19.5 C76 19.5 74 21.5 74 25 C74 21.5 72 19.5 68.5 19.5 C72 19.5 74 17.5 74 14 Z" fill="#FFFFFF"/>
              </g>
            </svg>
          </div>
          <span>Processing MoMo...</span>
        </button>
        <div class="card-title">Button State</div>
        <div class="card-caption">22px — Inline Payment Button</div>
      </div>
    </div>
  </div>
</body>
</html>
