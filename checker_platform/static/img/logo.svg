<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Icon -->
  <g transform="translate(6, 6)">
    <!-- Shield -->
    <path d="M26 4 L48 13 L48 35 C48 45 38 52 26 55 C14 52 4 45 4 35 L4 13 Z" 
          fill="url(#logoShield)" 
          stroke="url(#logoGold)" 
          stroke-width="2" />
    
    <!-- Inner Star -->
    <polygon points="26,14 29,22 37,22.5 30.5,27.5 33,35 26,30.5 19,35 21.5,27.5 15,22.5 23,22" 
             fill="url(#logoGold)" 
             stroke="#0b0f19" 
             stroke-width="0.8" />

    <!-- Emerald Check Badge -->
    <g transform="translate(18, 22)">
      <circle cx="20" cy="20" r="8" fill="#0b0f19" stroke="url(#logoEmerald)" stroke-width="1.8"/>
      <path d="M16.5 20 L19 22.5 L24 17.5" fill="none" stroke="url(#logoEmerald)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(68, 12)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">
      Checker<tspan fill="url(#logoGold)">Pay</tspan>
    </text>
    
    <!-- Ghana Tag -->
    <text x="146" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#f59e0b" letter-spacing="-0.03em">
      Ghana
    </text>

    <!-- Subtitle Flagship Slogan -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#94a3b8" letter-spacing="0.14em">
      OFFICIAL PORTAL GATEWAY &bull; ACT 843
    </text>
  </g>
</svg>
