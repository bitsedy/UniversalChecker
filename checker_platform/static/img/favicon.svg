<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Obsidian Space -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Ghana Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Shield Contour -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />

  <!-- Ghanaian Star Motif Backdrop -->
  <circle cx="32" cy="30" r="16" fill="rgba(245, 158, 11, 0.08)" />

  <!-- Authentic 5-Point Black Star of Ghana -->
  <!-- Scaled and centered at (32, 28) -->
  <polygon points="32,15 35.8,24.5 45.5,24.7 37.8,31 40.5,40.5 32,35 23.5,40.5 26.2,31 18.5,24.7 28.2,24.5" 
           fill="url(#goldGrad)" 
           stroke="#0b0f19" 
           stroke-width="1.2"
           filter="url(#goldGlow)" />

  <!-- Dynamic Verification Checkmark (Overlapping lower right) -->
  <g transform="translate(6, 4)">
    <circle cx="42" cy="42" r="10" fill="#0b0f19" stroke="url(#emeraldGrad)" stroke-width="2"/>
    <path d="M37.5 42 L40.5 45 L46.5 38.5" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
