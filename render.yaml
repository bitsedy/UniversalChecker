services:
  - type: web
    name: universal-checker-gh
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn checker_platform.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHECKER_DB_PATH
        value: checker.db
